<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>2FA — TMASK-TRANSPORTER</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/crt.css' %}">
</head>
<body>
<main style="display:flex; justify-content:center; align-items:center; min-height:100vh;">
  <div style="width:400px;">
    <div class="box">
      <span class="box-title">WERYFIKACJA DWUSKŁADNIKOWA</span>
      <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="msg-error">
          {% for error in form.non_field_errors %}&gt; {{ error }}{% endfor %}
        </div>
        {% endif %}
        <div class="field">
          <label>KOD Z APLIKACJI LUB KOD ZAPASOWY:</label>
          <input type="text" name="code" autofocus autocomplete="one-time-code">
        </div>
        <button type="submit" class="btn" style="width:100%;">[ ZATWIERDŹ ]</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
